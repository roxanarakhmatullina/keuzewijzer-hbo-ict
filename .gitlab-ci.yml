stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: matzleeflang/keuzewijzer
  IMAGE_TAG: Nextjs-app

test-python:
  stage: test
  image: python:3.10
  script:
    - python -c 'print("hello world")'
    ##python manage.py test
  tags:
    - python

build-image:
  stage: build
  tags:
    - docker-client
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker info
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG -f Client/dockerfile ./Client
    - docker push $IMAGE_NAME:$IMAGE_TAG

deploy:
  stage: deploy
  tags:
    - deploy-runner
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@128.199.43.9 "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -aq | xargs docker stop | xargs docker rm &&
      docker run -d -p 5000:5000 $IMAGE_NAME:$IMAGE_TAG"
