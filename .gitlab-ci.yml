stages:
  - build
  - deploy

variables:
  IMAGE_NAME: keuzewijzer
  FRONTEND_TAG: "$CI_COMMIT_SHA-nextjs-app"
  BACKEND_TAG: "$CI_COMMIT_SHA-django-app"
  FRONTEND_NAME: nextjs-app
  BACKEND_NAME: django-app

# Frontend Build
build-frontend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli
  script:
    - docker build --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL -t $IMAGE_NAME:$FRONTEND_TAG -f Client/Dockerfile ./Client
    - docker push $IMAGE_NAME:$FRONTEND_TAG
  rules:
    - if: '$CI_COMMIT_TAG =~ /Strato Server Runner|django|nextjs|deploy|production/'

# Backend Build
build-backend:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker-cli
  script:
    - docker build -t $IMAGE_NAME:$BACKEND_TAG -f Server/Dockerfile ./Server
    - docker push $IMAGE_NAME:$BACKEND_TAG
  rules:
    - if: '$CI_COMMIT_TAG =~ /Strato Server Runner|django|nextjs|deploy|production/'

# Frontend Deployment
deploy-frontend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@85.214.238.103 "
      docker stop $FRONTEND_NAME || true &&
      docker rm $FRONTEND_NAME || true &&
      docker pull $IMAGE_NAME:$FRONTEND_TAG &&
      docker run -d --name $FRONTEND_NAME -p 5000:5000 $IMAGE_NAME:$FRONTEND_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /Strato Server Runner|django|nextjs|deploy|production/'

# Backend Deployment
deploy-backend:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
  script:
    - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@85.214.238.103 "
      docker stop $BACKEND_NAME || true &&
      docker rm $BACKEND_NAME || true &&
      docker pull $IMAGE_NAME:$BACKEND_TAG &&
      docker run -d --name $BACKEND_NAME -p 8000:8000 $IMAGE_NAME:$BACKEND_TAG"
  rules:
    - if: '$CI_COMMIT_TAG =~ /Strato Server Runner|django|nextjs|deploy|production/'