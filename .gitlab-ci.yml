stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: matzleeflang/keuzewijzer
  FRONTEND_TAG: "$CI_COMMIT_SHA-Nextjs-app"
  BACKEND_TAG: "$CI_COMMIT_SHA-Django-app"
  FRONTEND_NAME: Nextjs-app
  BACKEND_NAME: Django-app

#tests-django:
#  stage: test
#  script:
#    - python manage.py test
#  tags:
#    - python

build-frontend:
  stage: build
  tags:
    - docker-client
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    NEXT_PUBLIC_API_URL: "$API_URL"
  before_script:
    - docker info
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build --pull --no-cache --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL -t $IMAGE_NAME:$FRONTEND_TAG -f Client/dockerfile ./Client
    - docker push $IMAGE_NAME:$FRONTEND_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  only:
    - main  

build-backend:
  stage: build
  tags:
    - docker-client
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker info
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build -t $IMAGE_NAME:$BACKEND_TAG -f Server/dockerfile ./Server
    - docker push $IMAGE_NAME:$BACKEND_TAG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  only:
    - main


deploy-frontend:
  stage: deploy
  tags:
    - deploy-runner
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@h2853458.stratoserver.net "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -a --filter "name=$FRONTEND_NAME" -q | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 5000:5000 --name $FRONTEND_NAME $IMAGE_NAME:$FRONTEND_TAG"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  only:
    - main

deploy-backend:
  stage: deploy
  tags:
    - deploy-runner
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@h2853458.stratoserver.net "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -a --filter "name=$BACKEND_NAME" -q | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 5000:5000 --name $BACKEND_NAME $IMAGE_NAME:$BACKEND_TAG &&
      docker images prune -a"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  only:
    - main