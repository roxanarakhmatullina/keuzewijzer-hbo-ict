  stage: deploy
  tags:
    - docker-deploy-uat
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@h2853458.stratoserver.net "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -a --filter "name=$UAT_CLIENT_NAME" -q | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 3002:3000 --name $UAT_CLIENT_NAME --network $UAT_DOCKER_NETWORK $IMAGE_NAME:$UAT_CLIENT_TAG"
  only:
    - ik/test/uat-env

deploy-dashboard-uat:
  stage: deploy
  tags:
    - docker-deploy-uat
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@h2853458.stratoserver.net "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -a --filter "name=$UAT_DASHBOARD_NAME" -q | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 3003:3000 --name $UAT_DASHBOARD_NAME --network $UAT_DOCKER_NETWORK $IMAGE_NAME:$UAT_DASHBOARD_TAG"
  only:
