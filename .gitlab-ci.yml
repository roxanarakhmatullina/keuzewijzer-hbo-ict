image: docker:20.10.24

variables:
  DOCKER_TLS_CERTDIR: ""  # Disables Docker's TLS setup in CI
  SSH_KEY: $SSH_KEY
  SERVER: root@h2853458.stratoserver.net
  CLIENT_IMAGE: client-image
  SERVER_IMAGE: server-image

stages:
  - build
  - deploy

before_script:
  # Install necessary tools (like ssh, ssh-keyscan)
  - apk add --no-cache openssh-client
  # Configure SSH key for server access
  - mkdir -p ~/.ssh
  - echo "$SSH_KEY" > ~/.ssh/id_rsa
  - chmod 600 ~/.ssh/id_rsa
  # Add server to known hosts to prevent prompt issues
  - ssh-keyscan -H $(echo $SERVER | cut -d '@' -f2) >> ~/.ssh/known_hosts
  # Start Docker in the CI environment
  - dockerd &  # Start the Docker daemon
  - sleep 10   # Wait for Docker to initialize

build_client:
  stage: build
  tags:
    - nextjs
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - Client/**
  script:
    - echo "Building Client Docker image..."
    - docker build -t $CLIENT_IMAGE:latest ./Client
    - docker save $CLIENT_IMAGE:latest | gzip > client.tar.gz
  artifacts:
    paths:
      - client.tar.gz
    expire_in: 1 hour

build_server:
  stage: build
  tags:
    - django
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      changes:
        - Server/**
  script:
    - echo "Building Server Docker image..."
    - docker build -t $SERVER_IMAGE:latest ./Server
    - docker save $SERVER_IMAGE:latest | gzip > server.tar.gz
  artifacts:
    paths:
      - server.tar.gz
    expire_in: 1 hour

deploy_client:
  stage: deploy
  tags:
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - echo "Deploying Client Docker image to remote server..."
    - scp client.tar.gz $SERVER:~/client.tar.gz
    - ssh $SERVER "docker load < ~/client.tar.gz && docker run -d --rm --name client-container -p 5000:5000 $CLIENT_IMAGE:latest"

deploy_server:
  stage: deploy
  tags:
    - deploy
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - echo "Deploying Server Docker image to remote server..."
    - scp server.tar.gz $SERVER:~/server.tar.gz
    - ssh $SERVER "docker load < ~/server.tar.gz && docker run -d --rm --name server-container -p 8000:8000 $SERVER_IMAGE:latest"