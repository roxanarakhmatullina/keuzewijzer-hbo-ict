  stage: build
  tags:
    - build-server-uat
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build --build-arg DB_HOST=$UAT_DB_HOST --build-arg DB_PORT=$UAT_DB_PORT --build-arg DB_USER=$UAT_DB_USER --build-arg DB_PASSWORD=$UAT_DB_PASS --build-arg DB_NAME=$UAT_DB_NAME --build-arg EMAIL_FROM=$EMAIL_FROM --build-arg EMAIL_PASS=$EMAIL_PASS --build-arg EMAIL_PORT=$EMAIL_PORT --build-arg EMAIL_SMTP_SERVER=$EMAIL_SMTP_SERVER --build-arg EMAIL_USR=$EMAIL_USR --build-arg JWT_AUDIENCE=$UAT_JWT_AUDIENCE --build-arg JWT_ISSUER=$UAT_JWT_ISSUER --build-arg JWT_SECRET=$UAT_JWT_SECRET -t $IMAGE_NAME:$UAT_SERVER_TAG -f Server/Dockerfile ./Server
    - docker push $IMAGE_NAME:$UAT_SERVER_TAG
  only:
    - ik/test/uat-env

