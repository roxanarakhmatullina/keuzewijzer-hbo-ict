stages:
  - test
  - build
  - deploy

variables:
    IMAGE_NAME: matzleeflang/keuzewijzer
    IMAGE_TAG: django-app

test-python:
  stage: test
  image: python:3.10
  script:
    - python -c 'print("hello world")'
  tags: 
    - python-runner
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'  # Runs only on development branch


build-image:
  stage: build
  tags:
    - docker-build
  services:
    - matzleeflang/keuzewijzer:dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build -t $IMAGE_NAME:$IMAGE_TAG .
    - docker push $IMAGE_NAME:$IMAGE_TAG
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'  # Runs only on development branch



deploy:
  stage: deploy
  before_script:
    -chmod 400 $SSH_KEY
  script: 
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@128.199.43.9 "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -aq | xargs docker stop | xargs docker rm &&
      docker run -d -p 5000:5000 $IMAGE_NAME:$IMAGE_TAG"
  rules:
    - if: '$CI_COMMIT_BRANCH == "development"'  # Runs only on development branch

