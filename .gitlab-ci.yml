stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: tlucassen/keuzewijzer

  CLIENT_TAG: "$CI_COMMIT_SHA-client"
  DASHBOARD_TAG: "$CI_COMMIT_SHA-dashboard"
  SERVER_TAG: "$CI_COMMIT_SHA-server"
  CLIENT_NAME: client
  DASHBOARD_NAME: dashboard
  SERVER_NAME: server

  UAT_CLIENT_TAG: "$CI_COMMIT_SHA-client-uat"
  UAT_DASHBOARD_TAG: "$CI_COMMIT_SHA-dashboard-uat"
  UAT_SERVER_TAG: "$CI_COMMIT_SHA-server-uat"
  UAT_CLIENT_NAME: uat-client
  UAT_DASHBOARD_NAME: uat-dashboard
  UAT_SERVER_NAME: uat-server
  UAT_DOCKER_NETWORK: uat_network

  # TO BE MOVED
  UAT_API_URL: http://uat-server:8080/api
  UAT_DB_PORT: 5432
  UAT_DB_USER: uat_root
  UAT_DB_HOST: postgres-uat
  UAT_DB_NAME: KeuzewijzerUAT
  UAT_JWT_AUDIENCE: http://uat-dashboard:3000 # dashboard (public)
  UAT_JWT_ISSUER: http://uat-server:8080/api   #api (docker network)
  UAT_JWT_SECRET: fsuhfdshfudshfhdsuhfuds

build-client:
  stage: build
  tags:
    - build-client
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build --pull --build-arg NEXT_PUBLIC_API_URL=$API_URL -t $IMAGE_NAME:$CLIENT_TAG -f Client/dockerfile ./Client
    - docker push $IMAGE_NAME:$CLIENT_TAG
  only:
    - main

build-dashboard:
  stage: build
  tags:
    - build-dashboard
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build --pull --build-arg NEXT_PUBLIC_API_URL=$API_URL -t $IMAGE_NAME:$DASHBOARD_TAG -f dashboard/dockerfile ./dashboard
    - docker push $IMAGE_NAME:$DASHBOARD_TAG
  only:
    - main

build-server:
  stage: build
  tags:
    - build-server
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build --build-arg DB_HOST=$DB_HOST --build-arg DB_PORT=$DB_PORT --build-arg DB_USER=$DB_USER --build-arg DB_PASSWORD=$DB_PASS --build-arg DB_NAME=$DB_NAME --build-arg EMAIL_FROM=$EMAIL_FROM --build-arg EMAIL_PASS=$EMAIL_PASS --build-arg EMAIL_PORT=$EMAIL_PORT --build-arg EMAIL_SMTP_SERVER=$EMAIL_SMTP_SERVER --build-arg EMAIL_USR=$EMAIL_USR --build-arg JWT_AUDIENCE=$JWT_AUDIENCE --build-arg JWT_ISSUER=$JWT_ISSUER --build-arg JWT_SECRET=$JWT_SECRET -t $IMAGE_NAME:$SERVER_TAG -f Server/Dockerfile ./Server
    - docker push $IMAGE_NAME:$SERVER_TAG
  only:
    - main

deploy-client:
  stage: deploy
  tags:
    - docker-deploy
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@h2853458.stratoserver.net "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -a --filter "name=$CLIENT_NAME" -q | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 3000:3000 --name $CLIENT_NAME $IMAGE_NAME:$CLIENT_TAG"
  only:
    - main

deploy-dashboard:
  stage: deploy
  tags:
    - docker-deploy
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@h2853458.stratoserver.net "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -a --filter "name=$DASHBOARD_NAME" -q | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 3001:3000 --name $DASHBOARD_NAME $IMAGE_NAME:$DASHBOARD_TAG"
  only:
    - main

deploy-server:
  stage: deploy
  tags:
    - docker-deploy
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@h2853458.stratoserver.net "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -a --filter "name=$SERVER_NAME" -q | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 5125:8080 --name $SERVER_NAME --network DB_connect $IMAGE_NAME:$SERVER_TAG &&
      docker image prune -a -f"
  only:
    - main

build-client-uat:
  stage: build
  tags:
    - build-client-uat
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build --pull --build-arg NEXT_PUBLIC_API_URL=$UAT_API_URL -t $IMAGE_NAME:$UAT_CLIENT_TAG -f Client/dockerfile ./Client
    - docker push $IMAGE_NAME:$UAT_CLIENT_TAG
  only:
    - ik/test/uat-env

