stages:
  - build
  - deploy

variables:
  IMAGE_NAME: keuzewijzer
  FRONTEND_TAG: "$CI_COMMIT_SHA-nextjs-app"
  BACKEND_TAG: "$CI_COMMIT_SHA-django-app"
  FRONTEND_NAME: nextjs-app
  BACKEND_NAME: django-app

build-frontend:
  stage: build
  tags:
    - nextjs
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    NEXT_PUBLIC_API_URL: "$API_URL"
  before_script:
    - apk add --no-cache docker-cli  # Ensure Docker CLI is installed
    - docker info
  script:
    - docker build --build-arg NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL -t $IMAGE_NAME:$FRONTEND_TAG -f Client/dockerfile ./Client
    - docker save $IMAGE_NAME:$FRONTEND_TAG | gzip > frontend-image.tar.gz
  artifacts:
    paths:
      - frontend-image.tar.gz
    expire_in: 1 hour

build-backend:
  stage: build
  tags:
    - django
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - apk add --no-cache docker-cli  # Ensure Docker CLI is installed
    - docker info
  script:
    - docker build -t $IMAGE_NAME:$BACKEND_TAG -f Server/dockerfile ./Server
    - docker save $IMAGE_NAME:$BACKEND_TAG | gzip > backend-image.tar.gz
  artifacts:
    paths:
      - backend-image.tar.gz
    expire_in: 1 hour

deploy-frontend:
  stage: deploy
  tags:
    - deploy
  dependencies:
    - build-frontend
  script:
    - scp -o StrictHostKeyChecking=no -i $SSH_KEY frontend-image.tar.gz root@h2853458.stratoserver.net:/tmp/
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@h2853458.stratoserver.net "
      gunzip -c /tmp/frontend-image.tar.gz | docker load &&
      docker ps -a --filter \"name=$FRONTEND_NAME\" -q | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 5000:5000 --name $FRONTEND_NAME $IMAGE_NAME:$FRONTEND_TAG"

deploy-backend:
  stage: deploy
  tags:
    - deploy
  dependencies:
    - build-backend
  script:
    - scp -o StrictHostKeyChecking=no -i $SSH_KEY backend-image.tar.gz root@h2853458.stratoserver.net:/tmp/
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@h2853458.stratoserver.net "
      gunzip -c /tmp/backend-image.tar.gz | docker load &&
      docker ps -a --filter \"name=$BACKEND_NAME\" -q | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 8000:8000 --name $BACKEND_NAME $IMAGE_NAME:$BACKEND_TAG &&
      docker images prune -a"