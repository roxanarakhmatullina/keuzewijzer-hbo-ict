deploy-server:
  stage: deploy
  tags:
    - docker-deploy
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@h2853458.stratoserver.net "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -a --filter "name=$SERVER_NAME" -q | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 5125:8080 --name $SERVER_NAME --network DB_connect $IMAGE_NAME:$SERVER_TAG &&
      docker images prune -a"
  only:
    - test/matz-testing-CI