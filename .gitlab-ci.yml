stages:
  - test
  - build
  - deploy

variables:
  IMAGE_NAME: matzleeflang/keuzewijzer
  FRONTEND_TAG: Nextjs-app
  BACKEND_TAG: Django-app

tests-django:
  stage: test
  script:
    - python -c 'print("hello world")'
    ##python manage.py test
  tags:
    - python

build-frontend:
  stage: build
  tags:
    - docker-client
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker info
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build -t $IMAGE_NAME:$FRONTEND_TAG -f Client/dockerfile ./Client
    - docker push $IMAGE_NAME:$FRONTEDN_TAG

build-backend:
  stage: build
  tags:
    - docker-client
  services:
    - docker:20.10.16-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
  before_script:
    - docker info
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASS
  script:
    - docker build -t $IMAGE_NAME:$BACKEND_TAG -f keuzewijzer/dockerfile ./keuzewijzer
    - docker push $IMAGE_NAME:$BACKEND_TAG

deploy-frontend:
  stage: deploy
  tags:
    - deploy-runner
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@206.189.97.124 "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -aq | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 3000:3000 $IMAGE_NAME:$FRONTEND_TAG"

deploy-frontend:
  stage: deploy
  tags:
    - deploy-runner
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@206.189.97.124 "
      docker login -u $REGISTRY_USER -p $REGISTRY_PASS &&
      docker ps -aq | xargs -r docker stop | xargs -r docker rm &&
      docker run -d -p 3001:3000 $IMAGE_NAME:$BACKEND_TAG"