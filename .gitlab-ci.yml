deploy-server-uat:
  stage: deploy
  tags:
    - docker-deploy-uat
  before_script:
    - chmod 400 $SSH_KEY
  script:
    - ssh -o StrictHostKeyChecking=no -i $SSH_KEY root@h2853458.stratoserver.net "
